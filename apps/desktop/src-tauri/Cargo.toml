[package]
name = "cursor-remote-desktop"
version = "0.1.0"
description = "Monitor and direct Cursor agents running on another computer"
authors = ["Christopher Ettner"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cursor_remote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
